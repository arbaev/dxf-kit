# Netlify configuration for dxf-kit

[build]
  command = "pnpm install && pnpm build && pnpm build:demo"

  publish = "dist-demo"

  [build.environment]
    NODE_VERSION = "20"

# Proxy Umami analytics through our domain so adblockers don't block first-party paths
[[redirects]]
  from = "/script.js"
  to = "https://cloud.umami.is/script.js"
  status = 200
  force = true

[[redirects]]
  from = "/api/send"
  to = "https://cloud.umami.is/api/send"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
