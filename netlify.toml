# Netlify configuration for dxf-kit

[build]
  # build → render+vuer+react dist; build:site → multi-page Vue demo into
  # dist-demo/: the neutral landing at / plus one static page per framework
  # wrapper (/vue, /react, /lit). Runnable framework examples live on StackBlitz
  # (see examples/*), not self-hosted here.
  command = "pnpm install && pnpm build && pnpm build:site"

  publish = "dist-demo"

  [build.environment]
    NODE_VERSION = "20"

# Proxy Umami analytics through our domain so adblockers don't block first-party paths
[[redirects]]
  from = "/script.js"
  to = "https://cloud.umami.is/script.js"
  status = 200
  force = true

[[redirects]]
  from = "/api/send"
  to = "https://cloud.umami.is/api/send"
  status = 200
  force = true

# Framework landing pages are real static files (dist-demo/{vue,react,lit}/index.html).
# These explicit rewrites make the no-trailing-slash form resolve to the right page
# instead of falling through to the SPA catch-all below. The /xxx/ form is served
# directly from the directory index.
[[redirects]]
  from = "/vue"
  to = "/vue/index.html"
  status = 200

[[redirects]]
  from = "/react"
  to = "/react/index.html"
  status = 200

[[redirects]]
  from = "/lit"
  to = "/lit/index.html"
  status = 200

# Unknown paths → branded 404 page with a real 404 status. No SPA fallback:
# this is a multi-page site, not a client-routed app, so rewriting everything to
# index.html would create soft-404s that hurt SEO. Real files and the framework
# rewrites above are matched first.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
