# Netlify configuration for dxf-kit

[build]
  # build → render+vuer+react dist; build:site → Vue demo into dist-demo/ then
  # React playground into dist-demo/react/ (order matters: demo first, it wipes
  # dist-demo; playground writes the /react/ subdir). Served at / and /react/.
  command = "pnpm install && pnpm build && pnpm build:site"

  publish = "dist-demo"

  [build.environment]
    NODE_VERSION = "20"

# Proxy Umami analytics through our domain so adblockers don't block first-party paths
[[redirects]]
  from = "/script.js"
  to = "https://cloud.umami.is/script.js"
  status = 200
  force = true

[[redirects]]
  from = "/api/send"
  to = "https://cloud.umami.is/api/send"
  status = 200
  force = true

# React playground SPA fallback — must precede the catch-all so /react/* falls
# back to the React index, not the Vue one. Real files (/react/assets/*) are
# served directly regardless.
[[redirects]]
  from = "/react/*"
  to = "/react/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/react/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
