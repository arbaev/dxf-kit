    <script>
      // Set the dark background before the app bundle loads so full-page
      // navigations don't flash white in dark mode (mirrors useDarkTheme.ts).
      (function () {
        try {
          var v = localStorage.getItem("dxf-vuer-demo:dark-theme");
          if (v === "1" || (v === null && matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.style.backgroundColor = "#121212";
          }
        } catch (e) {}
      })();
    </script>

    <!-- FAQ (mirrors the visible FAQ on the page; keep in sync with frameworks.ts) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I view a DXF file with a Web Component?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Install dxf-lit, import it once to register the <dxf-viewer> custom element, then add the tag with a url attribute (or load text through its methods). Pan, zoom, layers and measurement work out of the box — no build step or framework required."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use dxf-lit without a framework, or with Angular and Svelte?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. <dxf-viewer> is a standard Custom Element, so it drops into plain HTML and into any framework — Angular, Svelte, Vue, React, or none at all. Attributes drive the built-in UI and state flows back out through DOM Custom Events."
            }
          },
          {
            "@type": "Question",
            "name": "Does dxf-lit need a backend or AutoCAD?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The DXF is parsed and rendered entirely in the browser with WebGL — nothing is uploaded to a server, and AutoCAD is not required."
            }
          },
          {
            "@type": "Question",
            "name": "Which DXF entities are supported?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "22 entity types, including lines, arcs, circles, splines, hatches, dimensions, leaders, multilines, regions and block inserts with attributes — rendered by the shared dxf-render engine."
            }
          }
        ]
      }
    </script>
