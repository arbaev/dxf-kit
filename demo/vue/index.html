    <script>
      // Set the dark background before the app bundle loads so full-page
      // navigations don't flash white in dark mode (mirrors useDarkTheme.ts).
      (function () {
        try {
          var v = localStorage.getItem("dxf-vuer-demo:dark-theme");
          if (v === "1" || (v === null && matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.style.backgroundColor = "#121212";
          }
        } catch (e) {}
      })();

            "@type": "Question",
            "name": "How do I view a DXF file in Vue 3?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Install dxf-vuer, import the <DXFViewer> component and its stylesheet, then pass a url (or a parsed DXF). Pan, zoom, layers and measurement work out of the box — no extra setup."
            }
          },
          {
            "@type": "Question",
            "name": "Does dxf-vuer need a backend or AutoCAD?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The DXF is parsed and rendered entirely in the browser with WebGL — nothing is uploaded to a server, and AutoCAD is not required."
            }

            "@type": "Question",
            "name": "Which DXF entities are supported?",
            "acceptedAnswer": {
              "@type": "Answer",

            "name": "Is dxf-vuer written in TypeScript?",
